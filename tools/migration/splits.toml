  "-        config = RoutedProjectionConfig(block_shape=block) if block == (128, 128) else RoutedProjectionConfig.frozen_tiles(block)",
  "-    elif tuple(config.block_shape) != tuple(contract.fp8_block_shape):",
  "+    if tuple(config.block_shape) != tuple(contract.fp8_block_shape):",
  "-    always = jnp.ones((1,), jnp.bool_)",
  "-    zero_id = jnp.zeros((1,), jnp.int32)",
  "-        if shared_bf16 is None:",
  "-            shared_gate_up = fp8_routed_projection(hidden_local, ((shared_gate_bits_local[None], shared_gate_scale_local[None]), (shared_up_bits_local[None], shared_up_scale_local[None])), zero_id, always, config=config, result_dtype=jnp.float32, interpret=interpret)",
  "-        else:",
