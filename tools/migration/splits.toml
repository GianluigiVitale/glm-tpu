# S5 class splits (DESIGN 11.3 S5; the S5 plan's P9), checked by `tools/migration/split_check.py` (its docstring
# has the rules): every definition of the listed files at `base` is the declared or implicit origin of a
# definition now, compared by AST text after the declared rewrite with exactly the declared remaining lines, or is
# removed; every definition now has an origin or is added, with its source. A later split rewrites this table
# against its own base; each version is checked at the commit that applies it (history keeps them: S5 WU-E1 at
# 43fa28cb, S5 WU-S1/S2 at 4f225279, S5 WU-C1 at 7cfe5e99, S5 WU-S3 at fd3086b0, S5 IMP-23 at 2864a184, S5 WU-E2 at
# b1271cf4, S5 WU-F at f0e8bc8a, S5 WU-C3 at 66842e0e). S7 deletes tools/migration/.
#
# S5 WU-C2 (C = the command line; a planned, additive behaviour change, owner decision DN-24(b)): `glm-tpu checkpoint
# inventory` writes the source inventory of a local safetensors checkpoint and reads it back, and `glm-tpu checkpoint
# verify` checks a local sealed runtime checkpoint against the site file's pins; the new module
# glm_tpu/entrypoints/cli/checkpoint.py calls the checkpoint library and nothing else (packing, sealing and finalize
# stay outside the command line), and main registers the subcommand last. The two verification helpers that writer.py
# and manifest.py import lose their leading underscore (FOLLOWUPS 66, applied by tools/migration/work_units.toml): the
# rows below compare every definition of the four checkpoint files unchanged but for that rename. The tests follow: the
# help and argument literals gain the subcommand, the argument test reads the nested parsers, the fresh-process test
# also checks the checkpoint library stays unloaded, a test patches the renamed helper, the provenance test compares
# the renamed helpers under their new names (and the references to them as renamed), and
# tests/entrypoints/cli/test_checkpoint.py drives both commands on the G4 tiny checkpoint against the library.

