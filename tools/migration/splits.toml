# S5 class splits (DESIGN 11.3 S5; the S5 plan's P9), checked by `tools/migration/split_check.py` (its docstring
# has the rules): every definition of the listed files at `base` is the declared or implicit origin of a
# definition now, compared by AST text after the declared rewrite with exactly the declared remaining lines, or is
# removed; every definition now has an origin or is added, with its source. A later split rewrites this table
# against its own base; each version is checked at the commit that applies it (history keeps them: S5 WU-E1 at
# 43fa28cb, S5 WU-S1/S2 at 4f225279, S5 WU-C1 at 7cfe5e99, S5 WU-S3 at fd3086b0). S7 deletes tools/migration/.
#
# S5 IMP-23 (owner decision DN-23(c)): the dead FP8 shared-expert path of the decode MoE, left "for a later unit"
# by 040f7368. The only caller of moe_grouped_routes (decoder_layer.mlp_bf16) passes six None FP8 shared operands,
# the BF16 shared tables and the release tile config, so these never run and are removed: the six operands, the
# FP8 shared shape check and the two FP8 shared projections (the BF16 arms stay, unchanged, in the same named
# scopes), the two constants only those projections read, and the `config=None` default with the one call of
# RoutedProjectionConfig.frozen_tiles, which goes too. config and shared_bf16 are required; the two
# routed_projection annotations drop `| None`. write_empty_slot and RoutedProjectionConfig's fields stay (the
# kernel reads write_empty_slot; G1-/G2-protocol record the defaults). No message, value or program changes.

[stage]
name = "S5 IMP-23"
kind = "splits"
base = "496088b0"   # the tree this table was written against
files = [
  "glm_tpu/layers/moe/routed_experts.py",
  "glm_tpu/kernels/fp8_grouped_matmul/kernel.py",
  "glm_tpu/models/glm_moe_dsa/decoder_layer.py",
]

# the six FP8 shared operands leave the signature; config and shared_bf16 are required; the docstring's three
# sentences about them and the BF16 tables' module pointer are rewritten; the FP8 shared shape check, the config=None
# default, the two constants only the FP8 shared projections read and those two projections are removed (the BF16
# arms stay, dedented, in the same named scopes; ast.unparse prints the old `else: if` as `elif`)
[definitions."glm_tpu/layers/moe/routed_experts.py:moe_grouped_routes"]
diff = [
  "-def moe_grouped_routes(hidden_local: Any, route_indices: Any, route_weights: Any, expert_gate_bits_local: Any, expert_gate_scale_local: Any, expert_up_bits_local: Any, expert_up_scale_local: Any, expert_down_bits_local: Any, expert_down_scale_local: Any, shared_gate_bits_local: Any, shared_gate_scale_local: Any, shared_up_bits_local: Any, shared_up_scale_local: Any, shared_down_bits_local: Any, shared_down_scale_local: Any, *, contract: GlmMoeNumericalContract=GlmMoeNumericalContract(stage_size=8), config: RoutedProjectionConfig | None=None, expert_axis: str='expert', feature_axis: str='feature', interpret: bool=False, shared_bf16: tuple[Any, Any, Any] | None=None) -> Any:",
