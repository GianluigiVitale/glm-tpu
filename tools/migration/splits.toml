"tests/entrypoints/cli/test_collect_env.py:test_requires_python_is_a_specifier" = [
  "@pytest.mark.parametrize(('python', 'specifier', 'passed'), [((3, 12, 13), '>=3.12,<3.13', True), ((3, 12), '>=3.12,<3.13', True), ((3, 12, 13), '<3.13,>=3.12', True), ((3, 13, 0), '>=3.12,<3.13', False), ((3, 11, 9), '>=3.12,<3.13', False), ((3, 12, 0), '==3.12', True), ((3, 12, 1), '==3.12', False), ((3, 12, 1), '!=3.12.1', False), ((3, 12, 1), '>3.12', True), ((3, 12, 0), '>3.12', False), ((3, 12, 5), '<=3.12.5', True)])",
  "def test_requires_python_is_a_specifier(tmp_path, source, python, specifier, passed):",
  "    source(path=pyproject(tmp_path, SMALL.replace('\">=3.12,<3.13\"', f'\"{specifier}\"')))",
  "    installed = {'jax': '1.0', 'torch': '2.10.0'}",
  "    report = environment_report('core', version=installed.__getitem__, python_version=python)",
  "    assert (report['python'], report['expected_python'], report['passed']) == ('.'.join(map(str, python)), specifier, passed)",
]
"tests/entrypoints/cli/test_collect_env.py:test_unreadable_requirements_are_refused" = [
  "@pytest.mark.parametrize(('change', 'message'), [(('\">=3.12,<3.13\"', '\"~=3.12\"'), \"unsupported requires-python clause: '~=3.12'\"), (('\">=3.12,<3.13\"', '\"==3.12.*\"'), 'unsupported requires-python clause'), (('\">=3.12,<3.13\"', '\">=3.12,\"'), \"unsupported requires-python clause: ''\"), (('requires-python = \">=3.12,<3.13\"\\n', ''), 'glm-tpu declares no requires-python'), (('\"jax==1.0\"', '\"jax>=1.0\"'), 'not an exact pin: jax>=1.0'), (('\"jax==1.0\"', '\"jax[tpu]==1.0\"'), 'not an exact pin'), (('\"jax==1.0\"', '\"jax==1.0; python_version < \\'3.13\\'\"'), 'not an exact pin'), (('\"torch==2.10.0\"', '\"jax==1.1\"'), 'conflicting pins for jax'), (('name = \"glm-tpu\"', 'name = \"other\"'), 'does not declare the glm-tpu project'), (('dev = [\"pytest==9.0.3\"]', 'dev = []'), 'glm-tpu declares no dev requirements')])",
  "def test_unreadable_requirements_are_refused(tmp_path, source, change, message):",
  "    old, new = change",
  "    assert old in SMALL",
  "    source(path=pyproject(tmp_path, SMALL.replace(old, new)))",
  "    with pytest.raises(ValueError, match=re.escape(message)):",
  "        environment_report('dev', version=lambda name: '1.0', python_version=(3, 12))",
]
"tests/entrypoints/cli/test_collect_env.py:test_pins_that_differ_between_groups_are_refused" = [
