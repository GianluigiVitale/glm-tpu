# S5 class splits (DESIGN 11.3 S5; the S5 plan's P9), checked by `tools/migration/split_check.py` (its docstring
# has the rules): every definition of the listed files at `base` is the declared or implicit origin of a
# definition now, compared by AST text after the declared rewrite with exactly the declared remaining lines, or is
# removed; every definition now has an origin or is added, with its source. A later split rewrites this table
# against its own base; each version is checked at the commit that applies it (history keeps them: S5 WU-E1 at
# 43fa28cb, S5 WU-S1/S2 at 4f225279). S7 deletes tools/migration/.
#
# S5 WU-C1 (C = the command line; owner decisions DN-21 and DN-24(a)): the vLLM CLI layout for the `[split]` row
# "glm_tpu/entrypoints/cli/main.py" = [cli/types.py, cli/prepare.py, cli/collect_env.py] of move_map.toml. The
# one function `main` built every subcommand's parser and ran the chosen one; each subcommand is now a
# CLISubcommand (cli/types.py) with its parser (subparser_init) and its run (cmd): prepare-request in the new
# cli/prepare.py, doctor next to its report in cli/collect_env.py, info and ask in cli/main.py (ask's parser stays
# here and cmd imports cli/ask.py when it runs, as main did). `main` registers the four in the help order and runs
# the one named. Every parser statement and every branch body leaves `main` verbatim (sub -> subparsers); this
# checker proves what left `main` and the added text, not where each line went (one origin, one definition; see
# the unit's statement-cover log). No message, argument, default, exit code or output changes.

