  "+        dims = (((1,), (1,)), ((), ()))",
  "+        shared_gate_up = jnp.stack((lax.dot_general(hidden_local, shared_bf16[0], dims, preferred_element_type=jnp.float32), lax.dot_general(hidden_local, shared_bf16[1], dims, preferred_element_type=jnp.float32)), axis=1)",
  "-        if shared_bf16 is None:",
  "-            shared = fp8_routed_projection(activated[top_k:], ((shared_down_bits_local[None], shared_down_scale_local[None]),), zero_id, always, config=config, result_dtype=jnp.bfloat16, interpret=interpret)[:, 0]",
  "-        else:",
  "-            shared = lax.dot_general(activated[top_k:], shared_bf16[2], (((1,), (1,)), ((), ())), preferred_element_type=jnp.float32).astype(jnp.bfloat16)",
  "+        shared = lax.dot_general(activated[top_k:], shared_bf16[2], (((1,), (1,)), ((), ())), preferred_element_type=jnp.float32).astype(jnp.bfloat16)",
]

