# S5 class splits (DESIGN 11.3 S5; the S5 plan's P9), checked by `tools/migration/split_check.py` (its docstring
# has the rules): every definition of the listed files at `base` is the declared or implicit origin of a
# definition now, compared by AST text after the declared rewrite with exactly the declared remaining lines, or is
# removed; every definition now has an origin or is added, with its source. A later split rewrites this table
# against its own base; each version is checked at the commit that applies it (history keeps them: S5 WU-E1 at
# 43fa28cb, S5 WU-S1/S2 at 4f225279, S5 WU-C1 at 7cfe5e99, S5 WU-S3 at fd3086b0, S5 IMP-23 at 2864a184, S5 WU-E2 at
# b1271cf4). S7 deletes tools/migration/.
#
# S5 WU-F (F = file input; a planned behaviour change): read_bounded checks the open descriptor with fstat before
# any file object exists and closes it in a `finally` on every path. A directory therefore gets the same ValueError
# ("request input is not a bounded regular file") as every other input that is not a regular file of 1 to cap
# bytes, instead of the IsADirectoryError that os.fdopen raised while leaking the descriptor (FOLLOWUPS 29, 74).
# Open flags, both messages, the read and every other outcome are unchanged; the function gains a docstring. The
# tests follow: the directory assertion expects the ValueError, one test counts the process's open descriptors
# around 20 reads and refusals of each kind, and one runs `glm-tpu prepare-request` on a directory (its JSON error
# field now names ValueError).

[stage]
name = "S5 WU-F"
kind = "splits"
base = "93147c55"   # the tree this table was written against
files = [
  "glm_tpu/utils/io_utils.py",
  "tests/utils_/test_io_utils.py",
  "tests/entrypoints/cli/test_prepare.py",
]

# fstat the descriptor before wrapping it, the file object does not own it, one close in `finally`; the docstring
# is new (the lines between are unchanged: the regular-file check and its message)
[definitions."glm_tpu/utils/io_utils.py:read_bounded"]
diff = [
  "+    \"\"\"The bytes of the regular file ``path``, 1 to ``cap`` of them, opened without following a symlink.",
  "+",
  "+    Refused with ``ValueError``: a path through a symlink; anything but a regular file of 1 to ``cap`` bytes, such as",
  "+    a directory, a device, a FIFO (opened non-blocking, never waited on) or an empty or oversized file, checked on the",
  "+    open descriptor before any read (\"request input is not a bounded regular file\"); a file whose size leaves that",
  "+    range while it is read. ``OSError`` from the open (a missing or unreadable file) propagates. The descriptor is",
  "+    closed on every path.\"\"\"",
  "-    with os.fdopen(fd, 'rb') as stream:",
  "-        facts = os.fstat(stream.fileno())",
  "+    try:",
  "+        facts = os.fstat(fd)",
  "-        raw = stream.read(cap + 1)",
  "+        with os.fdopen(fd, 'rb', closefd=False) as stream:",
  "+            raw = stream.read(cap + 1)",
  "+    finally:",
  "+        os.close(fd)",
]

# a directory is refused with the ValueError of every other input that is not a bounded regular file
[definitions."tests/utils_/test_io_utils.py:test_read_bounded_refuses_symlinks_oversize_and_non_regular_files"]
diff = [
  "-    with pytest.raises(IsADirectoryError):",
  "+    with pytest.raises(ValueError, match='bounded regular file'):",
]

[added]
"tests/utils_/test_io_utils.py:test_read_bounded_closes_its_descriptor_on_every_path" = "WU-F: a read and every refusal, a directory's included, leave no descriptor open"
"tests/entrypoints/cli/test_prepare.py:test_a_directory_is_refused_as_a_value_error" = "WU-F: prepare-request refuses a directory as a ValueError"

[added_source]
"tests/entrypoints/cli/test_prepare.py:test_a_directory_is_refused_as_a_value_error" = [
  "def test_a_directory_is_refused_as_a_value_error(tmp_path, capsys):",
  "    \"\"\"The messages are read first: a directory is refused like every input that is not a bounded regular file.\"\"\"",
  "    assert not any((p.is_symlink() for p in (tmp_path, *tmp_path.parents)))",
  "    argv = list(ARGV)",
  "    argv[argv.index('--messages') + 1] = str(tmp_path)",
  "    capsys.readouterr()",
  "    assert main(argv) == 1",
  "    refusal = json.dumps(dict(error='ValueError', status='request preparation refused')) + '\\n'",
  "    assert capsys.readouterr() == ('', refusal)",
]
"tests/utils_/test_io_utils.py:test_read_bounded_closes_its_descriptor_on_every_path" = [
  "@pytest.mark.skipif(not os.path.isdir('/proc/self/fd'), reason=\"counts this process's open descriptors\")",
  "def test_read_bounded_closes_its_descriptor_on_every_path(tmp_path):",
  "    \"\"\"A read and every refusal, a directory's included, leave no descriptor open.\"\"\"",
  "    path = tmp_path / 'request.json'",
  "    path.write_bytes(b'{\"a\":1}')",
  "    (tmp_path / 'empty').write_bytes(b'')",
  "    fifo = tmp_path / 'fifo'",
  "    os.mkfifo(fifo)",
  "    refused = [(tmp_path, PAYLOAD_CAP), (fifo, PAYLOAD_CAP), (tmp_path / 'empty', PAYLOAD_CAP), (path, 1)]",
  "    before = len(os.listdir('/proc/self/fd'))",
  "    for _ in range(20):",
  "        assert read_bounded(path, PAYLOAD_CAP) == b'{\"a\":1}'",
  "        for refused_path, cap in refused:",
  "            with pytest.raises(ValueError, match='bounded regular file'):",
  "                read_bounded(refused_path, cap)",
  "    assert len(os.listdir('/proc/self/fd')) == before",
]
