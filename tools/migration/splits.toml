  "    lines = ['Metadata-Version: 2.4', 'Name: glm-tpu', f'Version: {version}', f'Requires-Python: {python}']",
  "    lines += [f'Requires-Dist: {requirement}' for requirement in requires]",
  "    (path / 'METADATA').write_text('\\n'.join(lines) + '\\n')",
  "    return path",
