[definitions]
# the BF16 weight groups the layer bodies take: models -> layers (verbatim)
"glm_tpu/layers/contracts.py:Bf16QkvAWeights" = { from = "glm_tpu/models/glm_moe_dsa/weights.py:Bf16QkvAWeights" }
"glm_tpu/layers/contracts.py:Bf16AttentionWeights" = { from = "glm_tpu/models/glm_moe_dsa/weights.py:Bf16AttentionWeights" }
"glm_tpu/layers/contracts.py:Bf16DsaWeights" = { from = "glm_tpu/models/glm_moe_dsa/weights.py:Bf16DsaWeights" }
"glm_tpu/layers/contracts.py:Bf16DenseWeights" = { from = "glm_tpu/models/glm_moe_dsa/weights.py:Bf16DenseWeights" }
# the numerical contracts: layers -> config (verbatim; their methods follow their classes, implicit rows)
"glm_tpu/config/cache.py:MlaNumericalContract" = { from = "glm_tpu/layers/contracts.py:MlaNumericalContract" }
"glm_tpu/config/cache.py:StageLocalKvLayout" = { from = "glm_tpu/layers/contracts.py:StageLocalKvLayout" }
"glm_tpu/config/cache.py:StageLocalKvLayout.owner" = { from = "glm_tpu/layers/contracts.py:StageLocalKvLayout.owner", diff = [
  "+    import jax.numpy as jnp",
] }
"glm_tpu/config/cache.py:DsaNumericalContract" = { from = "glm_tpu/layers/contracts.py:DsaNumericalContract" }
"glm_tpu/config/cache.py:GlmMoeNumericalContract" = { from = "glm_tpu/layers/contracts.py:GlmMoeNumericalContract" }
# the API error and the answer split: entrypoints -> the leaf exceptions module and engine/outputs.py (verbatim)
"glm_tpu/exceptions.py:ApiError" = { from = "glm_tpu/entrypoints/openai/protocol.py:ApiError" }
"glm_tpu/engine/outputs.py:final_channel" = { from = "glm_tpu/entrypoints/openai/tool_parser.py:final_channel" }
# the resident client raises the class it now imports by name (was protocol.ApiError, the same class)
"glm_tpu/engine/resident_client.py:Resident.prepare_api" = { rewrite = { "protocol.ApiError" = "ApiError" } }
