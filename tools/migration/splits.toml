]
"glm_tpu/entrypoints/cli/main.py:AskSubcommand.cmd" = [
  "@staticmethod",
  "def cmd(args: argparse.Namespace) -> int:",
  "    from glm_tpu.entrypoints.cli.ask import main as ask_main",
  "    return ask_main(args)",
]
"glm_tpu/entrypoints/cli/main.py:AskSubcommand.subparser_init" = [
  "def subparser_init(self, subparsers: argparse._SubParsersAction) -> argparse.ArgumentParser:",
  "    ask = subparsers.add_parser('ask', help='answer questions on the retained TPU site; optionally batch up to four')",
  "    inputs = ask.add_mutually_exclusive_group(required=True)",
  "    inputs.add_argument('question', nargs='?')",
  "    inputs.add_argument('--questions', type=Path, help='private JSON array of one to ten question strings')",
  "    ask.add_argument('--context', choices=('8k', '32k', '128k', '256k'), default='32k')",
  "    ask.add_argument('--keep-loaded', action='store_true', help='retain the ordinary model and fleet leases after answering; explicit stop required')",
  "    ask.add_argument('--concurrent', action='store_true', help='batch up to four conversations; requires --context 32k')",
  "    ask.add_argument('--max-new-tokens', type=int, help='optional output cap; default: all remaining context slots (up to 163840 in 128k mode); thinking and answer share this space')",
  "    ask.add_argument('--wall-seconds', type=int, default=86400)",
  "    ask.add_argument('--prepare-only', action='store_true', help='prepare private inputs without launching the model')",
  "    ask.add_argument('--site', type=Path, help='site file (default: $GLM_TPU_SITE_CONFIG, else $GLM_TPU_CONFIG_ROOT/site.toml)')",
  "    return ask",
]
