# S5 class splits (DESIGN 11.3 S5; the S5 plan's P9), checked by `tools/migration/split_check.py` (its docstring
# has the rules): every definition of the listed files at `base` is the declared or implicit origin of a
# definition now, compared by AST text after the declared rewrite with exactly the declared remaining lines, or is
# removed; every definition now has an origin or is added, with its source. A later split rewrites this table
# against its own base; each version is checked at the commit that applies it (history keeps them: S5 WU-E1 at
# 43fa28cb, S5 WU-S1/S2 at 4f225279, S5 WU-C1 at 7cfe5e99, S5 WU-S3 at fd3086b0, S5 IMP-23 at 2864a184, S5 WU-E2 at
# b1271cf4, S5 WU-F at f0e8bc8a). S7 deletes tools/migration/.
#
# S5 WU-C3 (C = the command line; a planned behaviour change, owner decision DN-24): the environment command is
# `glm-tpu collect-env`, with `doctor` kept as its alias (main keys each subcommand under every name its parser
# answers to, so the alias dispatches). Its pins are the requirements glm-tpu declares, read from the installed
# distribution's metadata, else from the checkout's pyproject.toml, else refused; glm_tpu/environment.json and the
# benchmark profile and extra are gone (restructure.py records the removed S3 destination in DISSOLVED_BY_HAND). A
# local version label matches its public version, and the running Python must satisfy the requires-python
# specifier (report schema v2). `glm-tpu info` drops the STATUS pointers and "WS32_2D" and names the serving API/UI
# and the 256K context with its recorded HBM-admission refusal. The tests follow: the manifest test goes, the help,
# info and argument literals and the report tests change with them, one fresh-process test checks what info,
# collect-env and --help leave unloaded, and tests/entrypoints/cli/test_collect_env.py covers the report's sources,
# rules and refusals.

