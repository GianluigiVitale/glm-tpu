[added_source]
"glm_tpu/entrypoints/cli/types.py:CLISubcommand" = [
  "class CLISubcommand:",
  "    \"\"\"One ``glm-tpu`` subcommand: its ``name``, its parser (``subparser_init``) and what it runs (``cmd``).\"\"\"",
  "    name: str",
]
"glm_tpu/entrypoints/cli/types.py:CLISubcommand.cmd" = [
  "@staticmethod",
  "def cmd(args: argparse.Namespace) -> int:",
  "    \"\"\"Run the subcommand on its parsed ``args``; return the process exit code.\"\"\"",
  "    raise NotImplementedError",
]
"glm_tpu/entrypoints/cli/types.py:CLISubcommand.subparser_init" = [
  "def subparser_init(self, subparsers: argparse._SubParsersAction) -> argparse.ArgumentParser:",
  "    \"\"\"Add the subcommand's parser to ``subparsers`` and return it.\"\"\"",
  "    raise NotImplementedError",
]
"glm_tpu/entrypoints/cli/prepare.py:PrepareRequestSubcommand" = [
  "class PrepareRequestSubcommand(CLISubcommand):",
  "    \"\"\"Write a prepared request file from a private chat; a refusal names only the error type.\"\"\"",
  "    name = 'prepare-request'",
]
"glm_tpu/entrypoints/cli/prepare.py:PrepareRequestSubcommand.cmd" = [
  "@staticmethod",
  "def cmd(args: argparse.Namespace) -> int:",
  "    try:",
  "        from glm_tpu.engine.request import prepare_file",
  "        extra = {} if args.profile == 'ordinary-greedy-8k' else dict(context_capacity=166912)",
  "        report = prepare_file(messages_path=args.messages, output=args.output, repo=args.repo, tokenizer_root=args.tokenizer_root, request_id=args.request_id, max_new_tokens=args.max_new_tokens, **extra)",
  "    except (ValueError, OSError, ImportError) as exc:",
  "        print(json.dumps(dict(error=type(exc).__name__, status='request preparation refused')), file=sys.stderr)",
  "        return 1",
  "    print(json.dumps(report, indent=2, sort_keys=True))",
  "    return 0",
]
"glm_tpu/entrypoints/cli/prepare.py:PrepareRequestSubcommand.subparser_init" = [
  "def subparser_init(self, subparsers: argparse._SubParsersAction) -> argparse.ArgumentParser:",
  "    prepare = subparsers.add_parser('prepare-request', help='tokenize a private chat locally; does NOT launch inference')",
  "    prepare.add_argument('--messages', type=Path, required=True)",
  "    prepare.add_argument('--output', type=Path, required=True)",
  "    prepare.add_argument('--repo', type=Path, required=True)",
  "    prepare.add_argument('--tokenizer-root', type=Path, required=True)",
  "    prepare.add_argument('--request-id', required=True)",
  "    prepare.add_argument('--profile', choices=('ordinary-greedy-8k', 'ordinary-greedy-128k'), default='ordinary-greedy-8k')",
  "    prepare.add_argument('--max-new-tokens', type=int, required=True)",
  "    return prepare",
]
"glm_tpu/entrypoints/cli/collect_env.py:CollectEnvSubcommand" = [
  "class CollectEnvSubcommand(CLISubcommand):",
  "    \"\"\"``glm-tpu doctor``: the environment report of one profile; exit 0 only when it passed.\"\"\"",
  "    name = 'doctor'",
]
"glm_tpu/entrypoints/cli/collect_env.py:CollectEnvSubcommand.cmd" = [
  "@staticmethod",
  "def cmd(args: argparse.Namespace) -> int:",
  "    report = environment_report(args.profile)",
  "    print(json.dumps(report, indent=2, sort_keys=True))",
  "    return 0 if report['passed'] else 1",
]
"glm_tpu/entrypoints/cli/collect_env.py:CollectEnvSubcommand.subparser_init" = [
  "def subparser_init(self, subparsers: argparse._SubParsersAction) -> argparse.ArgumentParser:",
  "    doctor = subparsers.add_parser('doctor', help='check installed version metadata without initializing TPU')",
  "    doctor.add_argument('--profile', choices=('core', 'runtime', 'tpu', 'benchmark', 'dev'), default='core')",
  "    return doctor",
]
"glm_tpu/entrypoints/cli/main.py:InfoSubcommand" = [
  "class InfoSubcommand(CLISubcommand):",
  "    \"\"\"``glm-tpu info``: the supported scope and the release limitations, as JSON.\"\"\"",
  "    name = 'info'",
]
"glm_tpu/entrypoints/cli/main.py:InfoSubcommand.cmd" = [
  "@staticmethod",
  "def cmd(args: argparse.Namespace) -> int:",
  "    try:",
  "        version = metadata.version('glm-tpu')",
  "    except metadata.PackageNotFoundError:",
  "        version = 'source checkout (not installed)'",
  "    print(json.dumps(dict(project='glm-tpu', version=version, release_status='private project; see docs/release/STATUS.md for trained admission and promotion', engine='native JAX WS32_2D', hardware='8 hosts / 32 TPU v4 chips', ordinary_profile='greedy; 8K combined, concurrent 32K per conversation, or 128K prompt / 166912 combined slots; see STATUS for measured scope', concurrent_requests=4, model='zai-org/GLM-5.3', concurrent_validation='GLM-5.3: four correct completed GSM8K answers; normal EOS, eight-host agreement and cleanup; short inputs only', concurrent_context_capacity=32768, concurrent_scope='fixed submitted group; see STATUS for hardware evidence; no online request admission', queued_questions=10, resume='resident ordinary inbox reuses the live model; no process-restart or durable KV recovery', serving='site-specific protected request harness; no supported HTTP endpoint', installation='wheel contains Python components only; full deployment requires source checkout and external assets', quality='full benchmark/model-card parity not established'), indent=2, sort_keys=True))",
  "    return 0",
]
"glm_tpu/entrypoints/cli/main.py:InfoSubcommand.subparser_init" = [
  "def subparser_init(self, subparsers: argparse._SubParsersAction) -> argparse.ArgumentParser:",
  "    return subparsers.add_parser('info', help='show supported scope and release limitations')",
]
"glm_tpu/entrypoints/cli/main.py:AskSubcommand" = [
  "class AskSubcommand(CLISubcommand):",
  "    \"\"\"``glm-tpu ask``: answer questions on the retained TPU site (``glm_tpu.entrypoints.cli.ask``).",
  "",
  "    Its parser is defined here and ``cmd`` imports ``ask`` only when it runs: ``ask`` imports the request module at",
