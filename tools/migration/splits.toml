# S5 class splits (DESIGN 11.3 S5; the S5 plan's P9), checked by `tools/migration/split_check.py` (its docstring
# has the rules): every definition of the listed files at `base` is the declared or implicit origin of a
# definition now, compared by AST text after the declared rewrite with exactly the declared remaining lines, or is
# removed; every definition now has an origin or is added, with its source. A later split rewrites this table
# against its own base; each version is checked at the commit that applies it (history keeps them: S5 WU-E1 at
# 43fa28cb, S5 WU-S1/S2 at 4f225279, S5 WU-C1 at 7cfe5e99, S5 WU-S3 at fd3086b0, S5 IMP-23 at 2864a184). S7
# deletes tools/migration/.
#
# S5 WU-E2 (owner decision DN-22: BatchedSession stays separate and only the other two sessions merge; no vote
# rewrite): the sampled base session Ws32RequestSession and its greedy subclass PackedRequestSession become one
# RequestSession, the class the engine builds. Its methods are the base's shared ones and the subclass's greedy step,
# verbatim; its constructor is the subclass's signature and policy check followed by the base body. The sampled parts
# that production never ran go: the seeded SampledRequestPolicy and request_uniform (FOLLOWUPS 24), the uniform
# replicator, the sampled step and both next_uniform methods. The session tests follow: the sampled-session tests are
# ported to RequestSession and the tests of tests/models/glm_moe_dsa/test_decode_program.py move into
# tests/engine/test_request_session.py (FOLLOWUPS 47, first half); that module is deleted (restructure.py records
# the removed S3 destination in DISSOLVED_BY_HAND). No message, vote, value or program changes.

