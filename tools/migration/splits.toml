# S5 class splits (DESIGN 11.3 S5; the S5 plan's P9), checked by `tools/migration/split_check.py` (its docstring
# has the rules): every definition of the listed files at `base` is the declared or implicit origin of a
# definition now, compared by AST text after the declared rewrite with exactly the declared remaining lines, or is
# removed; every definition now has an origin or is added, with its source. A later split rewrites this table
# against its own base; each version is checked at the commit that applies it (history keeps them: S5 WU-E1 at
# 43fa28cb, S5 WU-S1/S2 at 4f225279, S5 WU-C1 at 7cfe5e99). S7 deletes tools/migration/.
#
# S5 WU-S3 (S = serving and structure; owner decisions DN-21 and DN-23(b)): the DN-12 layering moves, which close
# three residuals of DESIGN 8.7. Definitions move down to the layer that uses them, verbatim; their old homes keep
# importing them, so every other importer is unchanged and each name is the same object everywhere:
# * layers -> models: the four BF16 weight groups the layer bodies take (Bf16QkvAWeights, Bf16AttentionWeights,
#   Bf16DsaWeights, Bf16DenseWeights) move from models/glm_moe_dsa/weights.py to layers/contracts.py; the layer
#   modules and decoder_layer.py import them from there, weights.py imports the ones it builds;
# * engine -> entrypoints: ApiError moves from entrypoints/openai/protocol.py to glm_tpu/exceptions.py and
#   final_channel from entrypoints/openai/tool_parser.py to engine/outputs.py (both re-exported from their old
#   homes); the resident client imports them from there;
# * config.cache -> layers.contracts (JAX): the four numerical contracts move to config/cache.py, which imports no
#   JAX; layers/contracts.py re-exports them. The one non-verbatim line: StageLocalKvLayout.owner imports
#   jax.numpy when it runs (its jax.Array annotations take jax from an `if TYPE_CHECKING:` import).
# No message, value or signature changes.

[stage]
name = "S5 WU-S3"
kind = "splits"
base = "71f79523"   # the tree this table was written against
files = [
  "glm_tpu/layers/contracts.py",
  "glm_tpu/models/glm_moe_dsa/weights.py",
  "glm_tpu/layers/linear.py",
  "glm_tpu/layers/mlp.py",
  "glm_tpu/layers/attention/mla.py",
  "glm_tpu/layers/attention/dsa_indexer.py",
  "glm_tpu/models/glm_moe_dsa/decoder_layer.py",
  "glm_tpu/exceptions.py",
  "glm_tpu/entrypoints/openai/protocol.py",
  "glm_tpu/entrypoints/openai/tool_parser.py",
  "glm_tpu/engine/outputs.py",
  "glm_tpu/engine/resident_client.py",
  "glm_tpu/config/cache.py",
  "glm_tpu/config/__init__.py",
]

[docstrings]
"glm_tpu/layers/contracts.py" = "WU-S: names where the contracts are defined and the BF16 weight groups it now holds"
"glm_tpu/exceptions.py" = "WU-S: names ApiError, now defined here"
"glm_tpu/entrypoints/openai/protocol.py" = "WU-S: names where ApiError is defined"
"glm_tpu/entrypoints/openai/tool_parser.py" = "WU-S: names where final_channel is defined"
"glm_tpu/engine/outputs.py" = "WU-S: names final_channel, now defined here"
"glm_tpu/config/cache.py" = "WU-S: the contracts are defined here; the module imports no JAX"
"glm_tpu/config/__init__.py" = "WU-S: no config module imports JAX any more"

[imports."glm_tpu/layers/contracts.py"]
added = [
