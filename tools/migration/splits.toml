"tests/entrypoints/cli/test_collect_env.py:test_a_local_version_label_matches_its_public_version" = [
  "@pytest.mark.parametrize(('installed', 'pin', 'status'), [('2.10.0+cpu', '2.10.0', 'match'), ('2.10.0+cu128', '2.10.0', 'match'), ('2.10.0', '2.10.0', 'match'), ('2.10.1+cpu', '2.10.0', 'mismatch'), ('2.10.0.post1', '2.10.0', 'mismatch'), ('1.0+cpu', '1.0+cpu', 'match'), ('1.0', '1.0+cpu', 'mismatch'), ('1.0+cu128', '1.0+cpu', 'mismatch')])",
