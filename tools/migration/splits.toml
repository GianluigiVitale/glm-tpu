]
"tests/entrypoints/cli/test_collect_env.py:test_a_marker_other_than_an_extra_is_refused" = [
  "def test_a_marker_other_than_an_extra_is_refused(tmp_path, source):",
  "    installed = dist_info(tmp_path, version='9.9.9', python='>=3.12', requires=['jax==1.0', 'torch==2.10.0; python_version < \"3.13\"'])",
