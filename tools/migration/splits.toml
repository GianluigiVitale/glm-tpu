  "    verified = library(packed.mapping)",
  "    sentinel = example_site(tmp_path / 'other')",
  "    with installed_site(sentinel):",
  "        code, out, err = run(capsys, ['checkpoint', 'verify', '--site', str(packed.site_file)])",
  "        assert get_current_site() is sentinel",
  "    assert (code, err) == (0, '')",
