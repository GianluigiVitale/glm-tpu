"glm_tpu/entrypoints/cli/checkpoint.py:inventory_source" = [
  "def inventory_source(source: Path, output: Path, *, model_id: str, revision: str) -> dict:",
  "    \"\"\"Inventory the safetensors checkpoint in ``source`` under the identity given, write it to ``output`` and read the",
  "    written file back; returns the inventory's identity and summary.",
  "",
  "    ``read_source_inventory`` reads the index, every file's header and ``config.json`` (no tensor payload),",
  "    ``write_source_inventory`` writes a new file (an existing one is refused) and ``inspect_source_inventory`` parses",
  "    and re-hashes it.",
  "    \"\"\"",
  "    from glm_tpu.exceptions import CheckpointValidationError",
  "    from glm_tpu.model_loader.source_inventory import inspect_source_inventory, read_source_inventory, write_source_inventory",
  "    inventory = read_source_inventory(source, model_id=model_id, source_revision=revision)",
  "    write_source_inventory(inventory, output)",
  "    written = inspect_source_inventory(output)",
  "    if written != inventory:",
  "        raise CheckpointValidationError(f'source inventory {output} does not read back as written')",
  "    return dict(schema='glm_tpu_source_inventory_report_v1', output=str(output), model_id=written.model_id, source_revision=written.source_revision, index_sha256=written.index_sha256, config_sha256=written.config_sha256, **written.summary_dict())",
]
"glm_tpu/entrypoints/cli/checkpoint.py:verify_checkpoint" = [
  "def verify_checkpoint(site: SiteConfig, *, root: Path | None=None, slots: Sequence[int] | None=None, local_slot_layout: bool=False, geometry: ModelGeometry | None=None) -> dict:",
  "    \"\"\"Verify the sealed runtime checkpoint at ``root`` (default: the site's ``checkpoint.root``) against the pins of",
  "    ``site``, installed as the current site for the call (its approved source buckets).",
  "",
  "    ``authenticated_inventory`` reads the site's source inventory and checks its pinned digest;",
  "    ``verify_runtime_checkpoint`` checks the manifest, SUCCESS, mesh and topology pins, re-derives every file record",
  "    from the inventory and ``geometry`` (default: the pinned GLM-5.3 geometry), and hashes every file, or only those of",
  "    ``slots``; with ``local_slot_layout`` the root holds only those slots (a worker's layout).",
  "    \"\"\"",
  "    from glm_tpu.config import model",
  "    from glm_tpu.config.site import set_current_site",
  "    from glm_tpu.model_loader.sharded_state.verify import verify_runtime_checkpoint",
  "    from glm_tpu.model_loader.source_inventory import authenticated_inventory",
  "    checkpoint, topology = (site.checkpoint, site.topology)",
  "    previous = set_current_site(site)",
  "    try:",
  "        inventory = authenticated_inventory(checkpoint.source_inventory, checkpoint.source_inventory_sha256)",
  "        verified = verify_runtime_checkpoint(checkpoint.root if root is None else root, expected_manifest_sha256=checkpoint.manifest_sha256, expected_success_sha256=checkpoint.success_sha256, expected_mesh_hash=topology.mesh_sha256, expected_topology_hash=topology.topology_sha256, inventory=inventory, geometry=model.geometry() if geometry is None else geometry, verify_file_hashes=True, verify_file_hash_slots=None if slots is None else tuple(slots), local_slot_layout=local_slot_layout)",
  "    finally:",
  "        set_current_site(previous)",
  "    return dict(schema='glm_tpu_checkpoint_verification_v1', root=str(verified.root), manifest_sha256=verified.manifest['manifest_sha256'], success_sha256=verified.success['success_sha256'], source_inventory_sha256=inventory.inventory_sha256, mesh_sha256=topology.mesh_sha256, topology_sha256=topology.topology_sha256, files=len(verified.plans), hashed_slots=sorted(verified.records_by_slot if slots is None else slots), local_slot_layout=local_slot_layout, passed=True, scope='manifest, SUCCESS seal and every file record re-derived from the source inventory and the geometry; the size of every file present and the hashes of the hashed slots; no TPU, fleet, lock or remote host')",
]
"glm_tpu/entrypoints/cli/checkpoint.py:CheckpointSubcommand" = [
  "class CheckpointSubcommand(CLISubcommand):",
  "    \"\"\"``glm-tpu checkpoint inventory|verify``: the report as JSON, exit 0; a refusal (the library's ``ValueError`` or",
  "    ``OSError``, a site-file refusal included) prints its type and message as JSON on standard error and exits 1.\"\"\"",
  "    name = 'checkpoint'",
]
"glm_tpu/entrypoints/cli/checkpoint.py:CheckpointSubcommand.cmd" = [
  "@staticmethod",
  "def cmd(args: argparse.Namespace) -> int:",
  "    try:",
  "        if args.action == 'inventory':",
  "            report = inventory_source(args.source, args.output, model_id=args.model_id, revision=args.revision)",
  "        else:",
  "            from glm_tpu.config.site import SiteConfig",
  "            report = verify_checkpoint(SiteConfig.load(args.site), root=args.root, slots=args.slots, local_slot_layout=args.local_slot_layout)",
  "    except (ValueError, OSError) as exc:",
  "        refusal = dict(error=type(exc).__name__, message=str(exc), status=f'checkpoint {args.action} refused')",
  "        print(json.dumps(refusal), file=sys.stderr)",
  "        return 1",
  "    print(json.dumps(report, indent=2, sort_keys=True))",
  "    return 0",
]
"glm_tpu/entrypoints/cli/checkpoint.py:CheckpointSubcommand.subparser_init" = [
  "def subparser_init(self, subparsers: argparse._SubParsersAction) -> argparse.ArgumentParser:",
  "    checkpoint = subparsers.add_parser('checkpoint', help='inventory a checkpoint source or verify a sealed checkpoint on local files')",
  "    actions = checkpoint.add_subparsers(dest='action', required=True)",
  "    inventory = actions.add_parser('inventory', help='write the inventory of a local safetensors source (no payload is read)')",
  "    inventory.add_argument('source', type=Path, help='directory of model.safetensors.index.json, its shards and config.json')",
  "    inventory.add_argument('--output', type=Path, required=True, help='the new inventory file (never overwritten)')",
  "    inventory.add_argument('--model-id', required=True, help='the model id to record, e.g. zai-org/GLM-5.3')",
  "    inventory.add_argument('--revision', required=True, help='the source revision to record')",
  "    verify = actions.add_parser('verify', help=\"verify a local sealed runtime checkpoint against the site file's pins\")",
  "    verify.add_argument('--site', type=Path, help='site file (default: $GLM_TPU_SITE_CONFIG, else $GLM_TPU_CONFIG_ROOT/site.toml)')",
  "    verify.add_argument('--root', type=Path, help=\"checkpoint root (default: the site's checkpoint.root)\")",
  "    verify.add_argument('--slots', type=int, nargs='+', metavar='SLOT', help='hash only these device slots, 0..31 (default: all)')",
  "    verify.add_argument('--local-slot-layout', action='store_true', help=\"the root holds only the --slots files (a worker's layout); any other slot file is refused\")",
  "    return checkpoint",
]
