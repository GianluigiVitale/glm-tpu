# S4.3 test merges (DESIGN 10.3 S4.3, 7.1): the tests that kept their basename in the mirrored directory
# at S3 because their design target was already taken (move_map.toml: "until S4.3 merges it") go to the
# test module that mirrors the production module they test. Applied by `tools/migration/restructure.py
# --apply test_merges.toml` (tools/migration/symbols.py: cut and paste of the source text with its
# leading comments, the imports the moved definitions need, the emptied source removed); `--check`
# proves every moved definition AST-equal to its base-commit original (imports aside) and no dissolved
# module left or named. Test code only: no test name, body, marker or parameter changes, and no
# closure_map.toml entry (G6 and G7 record glm_tpu modules and functions only). S7 deletes
# tools/migration/; history keeps it.
#
# Rules:
# * the target is the test module that mirrors, in the 7021a63a layout, the production module holding
#   what the file tests: merged into it when it exists, moved to it (a new module with the source's
#   docstring) when it does not;
# * a file that follows the S3 design of one module goes whole, helpers included, to that module's
#   test module, even when S4.1 has since moved some of what it tests elsewhere (this rule takes
#   precedence over the first: test_reference_attention -> test_mla, FOLLOWUPS 50); a file that tests
#   several S3 targets is split test by test (test_reference_core: the linear, rmsnorm and rotary
#   references and their production functions);
# * reference oracles (tests/reference/) are instruments, not subjects, and the shared contracts in
#   glm_tpu/layers/contracts.py are tested with their layer;
# * kept: test_source_inventory.py (mirrors its module) and test_production_helper_homes.py (migration
#   provenance, retired with this directory at S7).

[stage]
name = "S4.3"
kind = "symbols"
base = "7021a63a"   # the tree this table was written against

# Removed once every definition has left them (restructure.py refuses otherwise).
[dissolve]
modules = [
  "tests/config/test_glm53_model.py",
  "tests/engine/test_batched_session.py",
  "tests/layers/attention/test_reference_attention.py",
  "tests/layers/attention/test_reference_dsa.py",
  "tests/layers/test_reference_core.py",
  "tests/models/glm_moe_dsa/test_batched_decode.py",
  "tests/runner/test_batched_runtime.py",
]

# New test modules: the moved file's docstring, or the package's docstring style.
[create]
"tests/engine/test_llm_engine.py" = "Exercise the full prefill-to-batch host path with independent prompt lengths."
"tests/layers/test_rope.py" = "Tests of :mod:`glm_tpu.layers.rope`."
"tests/models/glm_moe_dsa/test_model.py" = """CPU32: batched execution matches eight independent histories and freezes EOS lanes.

The eight histories come from the production cache initializer and prefill (until S2f: the frozen
sampled FP8 prefill program, archived at ``archive/research-20260922``)."""

