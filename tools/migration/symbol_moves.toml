"glm_tpu/engine/request_session.py:RequestPolicy" = "SampledRequestPolicy"

# Docstrings of the modules this run creates (DESIGN 2).
[create]
"glm_tpu/config/cache.py" = "The decoder's cache configuration: model geometry, context capacity and the KV-cache, attention,\nDSA-indexer and MoE contracts derived from them."
"glm_tpu/config/parallel.py" = "Mesh axis names of the expert-8 x feature-4 mesh (EP8 x TP4).\n\nThe strings are serialized: part of ``mesh_hash``, of every checkpoint ``partition_spec`` and of the\nStableHLO shardings."
"glm_tpu/utils/json_utils.py" = "Canonical JSON: the hash contract (ASCII, sorted, compact) and the wire bytes of requests and\nresident commands (UTF-8)."
"glm_tpu/layers/contracts.py" = "Numerical contracts and state types shared by the layers.\n\nThe absorbed-MLA, DSA-indexer and MoE contracts, the stage-local KV-cache layout, the compact DSA\nselection carried between IndexShare layers, and the shape validators of their inputs."
"glm_tpu/layers/embed.py" = "Owner-masked token embedding on the expert-8 x feature-4 mesh (decode rows and prompt rows)."
"glm_tpu/engine/outputs.py" = "The token stream: one ``TokenEvent`` per generated token (its fields are a wire format)."
"glm_tpu/engine/llm_engine.py" = "Generation over a loaded runtime: one concurrent batch of conversations sharing the weights."
"glm_tpu/engine/resident_client.py" = "The file-inbox client of a resident controller, used by the chat UI and the OpenAI-compatible API."
"glm_tpu/entrypoints/cli/collect_env.py" = "The release environment report: installed versions against the declared requirements."
"glm_tpu/entrypoints/openai/protocol.py" = "OpenAI-compatible protocol constants and errors: model ids and aliases, reasoning efforts, request\ncaps and ``ApiError``."
"glm_tpu/entrypoints/openai/chat_utils.py" = "OpenAI chat messages and tools, mapped onto what the pinned GLM-5.3 chat template renders."
"glm_tpu/entrypoints/openai/tool_parser.py" = "Generated text: GLM ``<tool_call>`` parsing and the split of reasoning from the final answer."
"glm_tpu/entrypoints/serve/http_handler.py" = "The HTTP request handler of the chat UI and the ``/v1`` API (served on loopback only)."
"glm_tpu/entrypoints/serve/job_queue.py" = "The persistent queue of chat jobs, served one at a time by the resident controller."
"glm_tpu/entrypoints/serve/security.py" = "The local API key file, created owner-only on first use."
"glm_tpu/executor/staging.py" = "The staged bundle of a launch: ``git archive`` of the pinned commit with its source manifest, the\nrequest and the resolved site."
"glm_tpu/model_loader/sharded_state/writer.py" = "Packing owner shards: slot files, destination records and the manifest of a packed checkpoint."
"glm_tpu/model_loader/sharded_state/verify.py" = "Verification of a packed checkpoint: metadata, manifest and SUCCESS seals, file hashes."
"glm_tpu/model_loader/sharded_state/loader.py" = "Loading a verified packed checkpoint onto the device mesh."

