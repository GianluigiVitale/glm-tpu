# S4.1 redistribution (DESIGN 10.3 S4.1): every top-level definition of the 19 interim _s3_ modules
# and the definitions the whole-file [split] rows of move_map.toml send elsewhere, moved verbatim to
# their final modules (DESIGN 2, 3). Applied by `tools/migration/restructure.py --apply
# symbol_moves.toml` (tools/migration/symbols.py: cut and paste of the source text, the imports the
# moved definitions need, the reference rewrite of every importer); `--check` proves every moved
# definition equal to its base-commit original by AST (imports aside) and no reference to a
# dissolved module left. S7 deletes tools/migration/; history keeps it.
#
# Rules (the design's homes, DESIGN 3 "split" rows; deviations are marked "# deviation:"):
# * definitions only the tests use (reference oracles) go to tests/reference/ (DESIGN 7.1); the
#   ones production shares with the reference stay in the production module;
# * shared contracts and state types go to glm_tpu/layers/contracts.py, so that no two layer
#   modules import each other (DESIGN 8.7 layering);
# * a class that the design splits by method (OrdinaryRuntime -> TPUModelRunner + LLMEngine,
#   Chats -> JobQueue + ConversationStore, the three request sessions -> one RequestSession) moves
#   whole to the module of its primary role; the work units split its methods (DESIGN 11.3);
# * a name that already exists in the destination is resolved by a rename in the same run
#   ([renames], or `as` on the moved definition).

[stage]
name = "S4.1"
kind = "symbols"
base = "bfd4345c"   # the tree this table was written against

# Removed once every definition has left them (restructure.py refuses otherwise).
[dissolve]
modules = [
  "glm_tpu/config/_s3_model.py",
  "glm_tpu/engine/_s3_batched_session.py",
  "glm_tpu/engine/_s3_user_request.py",
  "glm_tpu/layers/_s3_dsa_association.py",
  "glm_tpu/layers/_s3_dsa_host_rope.py",
  "glm_tpu/layers/_s3_linear.py",
  "glm_tpu/layers/_s3_prefill_index.py",
  "glm_tpu/layers/_s3_prefill_linear.py",
  "glm_tpu/layers/_s3_rmsnorm.py",
  "glm_tpu/layers/attention/_s3_attention.py",
  "glm_tpu/layers/attention/_s3_dsa.py",
  "glm_tpu/layers/attention/_s3_prefill_dsa.py",
  "glm_tpu/layers/moe/_s3_prefill_routes.py",
  "glm_tpu/models/glm_moe_dsa/_s3_batched_decode.py",
  "glm_tpu/models/glm_moe_dsa/_s3_prefill_window.py",
  "glm_tpu/models/glm_moe_dsa/_s3_request_loop.py",
  "glm_tpu/models/glm_moe_dsa/_s3_ws32_decoder.py",
  "glm_tpu/models/glm_moe_dsa/_s3_ws32_layer.py",
  "glm_tpu/runner/_s3_batched_runtime.py",
]

# Files that name interim modules on purpose (file = exact spellings kept; restructure.py --check
# accepts them): the S2f provenance test keys its tables by the S3 homes and follows them through
# this table to the final homes.
[baseline_references]
"tests/test_production_helper_homes.py" = [
  "glm_tpu/layers/moe/_s3_prefill_routes.py",
  "glm_tpu/layers/attention/_s3_attention.py",
  "glm_tpu/layers/attention/_s3_dsa.py",
  "glm_tpu/layers/_s3_linear.py",
  "glm_tpu/layers/_s3_prefill_index.py",
  "glm_tpu/layers/_s3_rmsnorm.py",
  "glm_tpu/layers/_s3_dsa_host_rope.py",
  "glm_tpu/models/glm_moe_dsa/_s3_ws32_layer.py",
  "glm_tpu/models/glm_moe_dsa/_s3_ws32_decoder.py",
  "glm_tpu/layers/_s3_dsa_association.py",
  "glm_tpu/layers/_s3_prefill_linear.py",
  "glm_tpu/layers/attention/_s3_prefill_dsa.py",
]

# Collisions resolved in this run (the S4.2 public names follow in renames.toml).
[renames]
