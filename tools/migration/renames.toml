# S4.2 public names (DESIGN 10.3 S4.2): top-level definitions of glm_tpu/ renamed in place to their
# public names. Applied by `tools/migration/restructure.py --apply renames.toml` (tools/migration/
# symbols.py, rename step B and the reference pass C/D); `--check renames.toml` proves every renamed
# definition AST-equal to its base-commit original with the renames undone (imports aside). Each S4
# table is checked by name at its own step (this table renames definitions symbol_moves.toml
# placed); the default `--check` runs move_map.toml (S3) only. S7 deletes tools/migration/; history
# keeps it.
#
# Rules (the names were reviewed and approved by the owner):
# * R1: drop the topology tag Ws32 / ws32_ / WS32_ (the package has one mesh, EP8 x TP4);
# * R2: drop the `_mapped` suffix of shard_map bodies (the layers package is per-shard by definition);
# * R3: a collision takes a `sharded_` prefix (norm.rms_norm exists) or, for the checkpoint-layout
#   weight classes, an `Fp8` prefix (twins of Bf16*Weights); generic local words (logits, embedding)
#   take a verb;
# * R4: drop the research vocabulary (challenger, greenfield, m64); StrategyNd stays (the config field
#   strategy_nd_dense is a G1/G2-protocol key).
# Only identifiers change: serialized values (axis names, checkpoint kinds and plan id, wire schemas),
# the frozen G4 refusal wording, Pallas kernel names (S4.2b) and named scopes (S4.4) stay as spelled.
# Not renamed here: the classes the work units split or remove (OrdinaryRuntime, Chats, Api, the three
# request sessions, SampledRequestPolicy), the WU-R admission functions (inspect_research_hlo,
# memory_projection), the G1 FP8-table capture hook (_decode_program), the G9-visible
# _batched_fleet_all, and the private helpers other modules import (R5: deferred to S4.4).

[stage]
name = "S4.2"
kind = "renames"
base = "4603930f"   # the tree this table was written against

