# S5 A2 test moves (DESIGN 11.3 S5, 7.1; the S5 plan's A2 (h) and (i)): tests that a file of another subject
# holds go to the test module that mirrors the production module they call. Applied by
# `tools/migration/restructure.py --apply test_moves.toml` (tools/migration/symbols.py, as S4.3's
# test_merges.toml: cut and paste of the source text with its leading comments, the imports the moved
# definitions need, the emptied source removed); `--check test_moves.toml` proves every moved definition
# AST-equal to its base-commit original (imports aside) and no dissolved module left or named. Test code
# only: no test name, body, marker or parameter changes, and no closure_map.toml entry (G6 and G7 record
# glm_tpu modules and functions only). S7 deletes tools/migration/; history keeps it.
#
# Targets, by the subject each test calls:
# * config/test_model.py kept the site binding tests of the dissolved test_glm53_model.py (S4.3, whole-file
#   rule; FOLLOWUPS 52): they call config.site (site_args, SiteConfig) -> tests/config/test_site.py;
# * executor/test_launch.py was an S3 name choice for tests of several modules (FOLLOWUPS 47, second half):
#   multihost_executor (summarize, the resident controller, the lease order of main), the worker
#   (resident_loop, preflight), fleet (ssh_commands, remote_all), io_utils (private) and config.site
#   (require_site); it is dissolved. Its shared helper `rows` goes with the executor tests; the worker's
#   resident tests import it from there.
# Also dissolved: tests/reference/conftest.py, whose marker registration and cpu32 budget hook were merged by
# hand into tests/conftest.py (hooks are not moved definitions; the S5 plan's P7).

[stage]
name = "S5 A2"
kind = "symbols"
base = "9323a4fc"   # the tree this table was written against

# Removed once every definition has left them (restructure.py refuses otherwise).
[dissolve]
modules = [
  "tests/executor/test_launch.py",
  "tests/reference/conftest.py",
]

# New test modules: the package's docstring style.
[create]
"tests/executor/test_fleet.py" = "Tests of :mod:`glm_tpu.executor.fleet`: the SSH command discovery and the fan-out, offline."

# config/site.py: the source-completion binding of the site (site_args) and the missing-file refusal
[moves."tests/config/test_model.py"]
site_fixture = "tests/config/test_site.py"
test_new_site_binds_complete_source_without_legacy_overlay = "tests/config/test_site.py"
test_incomplete_or_other_model_source_refused_even_with_matching_digest = "tests/config/test_site.py"
test_changed_source_completion_receipt_refused = "tests/config/test_site.py"
test_site_does_not_fall_back_when_missing = "tests/config/test_site.py"

[moves."tests/executor/test_launch.py"]
# executor/multihost_executor.py: summarize, resident_controller, main's lease order before any SSH
rows = "tests/executor/test_multihost_executor.py"
test_complete_fleet_required = "tests/executor/test_multihost_executor.py"
test_identity_and_failure_cannot_publish = "tests/executor/test_multihost_executor.py"
test_graph_or_output_disagreement_cannot_publish = "tests/executor/test_multihost_executor.py"
test_resident_result_never_claims_cleanup = "tests/executor/test_multihost_executor.py"
test_resident_controller_keeps_idle_model_past_inference_deadline = "tests/executor/test_multihost_executor.py"
test_model_owner_refuses_but_backup_waits_before_any_ssh = "tests/executor/test_multihost_executor.py"
# worker/tpu_worker.py: resident_loop, preflight
test_resident_reuses_runtime_and_has_explicit_stop = "tests/worker/test_tpu_worker.py"
test_resident_refuses_ambiguous_or_incompatible_input = "tests/worker/test_tpu_worker.py"
test_worker_default_off_before_model_import = "tests/worker/test_tpu_worker.py"
# executor/fleet.py: ssh_commands, remote_all
test_ssh_unknown_host_never_dispatches = "tests/executor/test_fleet.py"
test_ssh_failure_is_not_retried = "tests/executor/test_fleet.py"
# utils/io_utils.py: private
test_private_input_rejects_public_permissions_and_symlink = "tests/utils_/test_io_utils.py"
# config/site.py: require_site
test_migration_refuses_inherited_glm52_checkpoint = "tests/config/test_site.py"
