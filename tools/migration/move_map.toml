# Which tracked text files have their module and path references rewritten.
[rewrite]
include = ["glm_tpu/**", "tests/**", "tools/**", "docs/**", "examples/**", "*.md", "pyproject.toml", ".gitignore"]
exclude = [
  "AGENTS.md", "HANDOFF.md", "goal.md", "docs/release/STATUS.md",  # governance files: unchanged until S9 (D23)
  "tests/reference/VALIDATION.md",   # the S2e receipt names the tree it validated
  "tests/golden/data/**",            # recorded by the harness (re-baseline commits), never edited
  "tools/migration/**",              # the S2f records and this map
  "tools/equivalence/closure_map.toml",  # restructure.py writes its [modules] table for the moved modules
  "glm_tpu/models/glm_moe_dsa/hf_config/**", "glm_tpu/entrypoints/ui/static/**",  # byte-identical assets
]
suffixes = [".py", ".md", ".toml", ".gitignore"]   # never model assets, UI assets or recorded data

# References to 181c013e names that stay as spelled (file = exact old names): the harness compares
# with the baseline commit and must name what it had.
[baseline_references]
"tools/equivalence/budget.py" = [
  # live-run detection also recognizes a controller, worker or pack worker started from a checkout
  # in the 181c013e layout (DESIGN 7.5.10: "old or new names")
  "scripts.release.launch_ws32_optimized_request",
  "scripts.release.ws32_optimized_worker",
  "scripts.release.ws32_pack_worker",
]
"tools/equivalence/site_fixture.py" = [
  "glm_tpu/optimized/model.py",       # read from the baseline commit (git show 181c013e:<path>)
]
"tools/equivalence/fixture.py" = [
  "reference/hf-glm53/config.json",   # the config in an extracted 181c013e tree (diff --against)
]
"tools/equivalence/identities.py" = [
  "scripts.release.ws32_optimized_worker",  # the worker module in its 181c013e role (G5 launcher record)
]
"tests/engine/test_resident_protocol.py" = [
  "scripts.release.launch_ws32_optimized_request",  # D11: the resident client refuses the old controller
]

# Files that may name paths of the research tree archived at S2f (glm_tpu/greenfield,
# scripts/greenfield, tests/greenfield): they read those blobs from the commits that had them.
[provenance]
"tests/test_production_helper_homes.py" = "compares each moved definition with its origin at 181c013e / the S2f base (git show <commit>:<path>)"
"tools/equivalence/fixture.py" = "historical_equivalence: the recipe that re-checks fixture.json against the historical fixture of eab8993f"

[pyproject]
package_data = ["environment.json", "models/glm_moe_dsa/hf_config/*", "entrypoints/ui/static/*"]
license_files = ["THIRD_PARTY_NOTICES.md", "licenses/*.txt", "glm_tpu/models/glm_moe_dsa/hf_config/LICENSE"]
# the legacy black formatting boundary, following its 28 moved files (S4.3 replaces it with ruff)
black_include = '^/(glm_tpu/(__init__|__main__|engine/_s3_user_request|entrypoints/cli/main|executor/multihost_executor|model_loader/pack_worker|worker/tpu_worker)\.py|tools/.*\.py|tests/(config/test_glm53_model|engine/test_batched_session|engine/test_request|entrypoints/cli/test_ask|entrypoints/cli/test_main|entrypoints/openai/test_serving_chat|entrypoints/serve/test_http_handler|executor/test_launch|layers/attention/test_dsa_indexer|layers/test_fp8|layers/test_linear|model_loader/sharded_state/test_manifest|models/glm_moe_dsa/test_batched_decode|models/glm_moe_dsa/test_decode_program|models/glm_moe_dsa/test_prefill|runner/test_batched_runtime|runner/test_programs|runner/test_tpu_runner|test_import_boundaries|test_production_helper_homes|worker/test_tpu_worker)\.py)$'
