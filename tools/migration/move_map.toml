# S3 structural move (DESIGN 10.3 S3): the destination of every tracked file, applied by
# tools/migration/restructure.py (git mv, then a libcst rewrite of every import, dotted-module
# string and file-path string). S7 deletes tools/migration/; history keeps it.
#
# Rules (DESIGN 3.0):
# * a file moves whole to its primary destination (DESIGN 2 / 3; the S2d/S2f modules of
#   FOLLOWUPS 15 and 23 by their 181c013e origin);
# * a file the design merges into a module that another file already fills goes whole to an
#   interim module _s3_<old basename>.py next to that target ([interim]); S4.1 redistributes the
#   definitions of every _s3_ module and of the whole-file splits ([split]) and deletes the
#   interim modules;
# * tests go to the path that mirrors their subject (DESIGN 7.1); a test whose design target is
#   already taken keeps its basename in the mirrored directory until S4.3 merges it;
# * contents are unchanged except the rewritten references (and the S3 process-contract edits
#   listed in the move commit), so `git show -M` detects every move as a rename.

[stage]
name = "S3"
base = "450f6aba"  # the tree this map was written against (git ls-files)

# Every path tracked at the base: its destination (the same path when it stays).
[files]

