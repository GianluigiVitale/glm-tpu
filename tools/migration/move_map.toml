# New package initializers (docstring only): path = docstring.
[packages]
"glm_tpu/kernels/__init__.py" = "Pallas TPU kernels, one package per operation; each ``kernel.py`` holds the public entry point.\n\n``sparse_mla``: sparse multi-head latent attention over the selected KV positions (decode, and the\nowner-local partial with log-sum-exp outputs that prefill merges). ``fp8_grouped_matmul``: routed-expert\nmatmuls over FP8 weights with 128-block scales (decode tiles, prefill expert panels)."
"glm_tpu/kernels/sparse_mla/__init__.py" = "Sparse MLA attention kernels: decode (``kernel``) and the owner-local partial attention with\nlog-sum-exp outputs used by prefill (``partial_kernel``)."
"glm_tpu/kernels/fp8_grouped_matmul/__init__.py" = "FP8 grouped (routed-expert) matmul kernels with 128x128 block scales: decode over scalar-prefetched\nroutes (``kernel``), the prefill panel kernel (``panel_kernel``) and expert-panel planning (``panels``)."
"glm_tpu/layers/__init__.py" = "Per-shard JAX layer bodies, run inside ``shard_map`` on the expert-8 x feature-4 device mesh: norms,\nrotary embeddings, linear projections, the dense MLP, FP8 decoding, sampling, attention (``attention``)\nand mixture-of-experts (``moe``)."
"glm_tpu/layers/attention/__init__.py" = "Attention layers: multi-head latent attention (``mla``), KV-cache writes and gathers (``kv_cache``) and\nthe DSA indexer that selects the attended positions (``dsa_indexer``)."
"glm_tpu/layers/moe/__init__.py" = "Mixture-of-experts layers: the router (``router``) and the routed experts (``routed_experts``)."
"glm_tpu/models/__init__.py" = "Model definitions: GLM-5.3 (``glm_moe_dsa``; Hugging Face architecture ``GlmMoeDsaForCausalLM``)."
"glm_tpu/models/glm_moe_dsa/__init__.py" = "GLM-5.3 (``GlmMoeDsaForCausalLM``): 78 decoder layers of multi-head latent attention with the DSA\nindexer and a mixture of 256 routed FP8 experts.\n\n``model`` builds the decode programs, ``prefill`` the prefill program, ``decoder_layer`` holds the\nlayer bodies, ``state`` the device state and ``weights`` the checkpoint and resident weight trees.\n``hf_config/`` holds the pinned Hugging Face assets (package data; SHA-256 pins in\n:mod:`glm_tpu.config`)."
"glm_tpu/model_loader/__init__.py" = "The checkpoint pipeline: source inventory (``source_inventory``), per-device placement\n(``placement``), per-host packing (``pack_worker``) and the sharded runtime-checkpoint format\n(``sharded_state``)."
"glm_tpu/model_loader/sharded_state/__init__.py" = "The sharded runtime checkpoint: one file per device slot behind a fixed header, the manifest and\nseal that bind the files, verification and loading."
"glm_tpu/worker/__init__.py" = "The per-host TPU worker process (``python -m glm_tpu.worker.tpu_worker``), started by the rank-0\ncontroller."
"glm_tpu/entrypoints/__init__.py" = "Entry points: the command line (``cli``), the OpenAI-compatible API (``openai``), the loopback HTTP\nserver (``serve``) and the chat UI (``ui``)."
"glm_tpu/entrypoints/cli/__init__.py" = "The ``glm-tpu`` command line (also ``python -m glm_tpu``)."
"glm_tpu/entrypoints/openai/__init__.py" = "The OpenAI-compatible chat-completions surface, served against a resident controller."
"glm_tpu/entrypoints/serve/__init__.py" = "The loopback HTTP server that hosts the chat UI and the ``/v1`` API against a resident controller."
"glm_tpu/entrypoints/ui/__init__.py" = "The browser chat UI; ``static/`` holds its page, script and style sheet (package data)."
"tests/kernels/__init__.py" = "Tests of :mod:`glm_tpu.kernels`."
"tests/layers/__init__.py" = "Tests of :mod:`glm_tpu.layers`."
"tests/layers/attention/__init__.py" = "Tests of :mod:`glm_tpu.layers.attention`."
"tests/layers/moe/__init__.py" = "Tests of :mod:`glm_tpu.layers.moe`."
"tests/models/__init__.py" = "Tests of :mod:`glm_tpu.models`."
"tests/models/glm_moe_dsa/__init__.py" = "Tests of :mod:`glm_tpu.models.glm_moe_dsa`."
"tests/model_loader/__init__.py" = "Tests of :mod:`glm_tpu.model_loader`."
"tests/model_loader/sharded_state/__init__.py" = "Tests of :mod:`glm_tpu.model_loader.sharded_state`."
"tests/runner/__init__.py" = "Tests of :mod:`glm_tpu.runner`."
"tests/entrypoints/__init__.py" = "Tests of :mod:`glm_tpu.entrypoints`."
