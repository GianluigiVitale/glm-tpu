# S5 D owed tests (DESIGN 11.3 S5, 7.1, 7.6; the S5 plan's Phase D, D1): the reference-against-production
# cross-validation leaves the reference's own test module for the test module of its subject, production's
# glm_moe_dsa model (tests/models/glm_moe_dsa/test_against_reference.py, owed since S2e/S2f: tests/reference/
# VALIDATION.md, "the recorded floor for tests/models/glm_moe_dsa/test_against_reference.py (S5)"). Applied by
# `tools/migration/restructure.py --apply owed_tests.toml` (tools/migration/symbols.py, as S5 A2's
# test_moves.toml: cut and paste of the source text with its leading comments, the imports the moved
# definitions need); `--check owed_tests.toml` proves every moved definition AST-equal to its base-commit
# original (imports aside). Test code only: no test name, body, marker or parameter changes, and no
# closure_map.toml entry (G6 and G7 record glm_tpu modules and functions only). S7 deletes tools/migration/;
# history keeps it.
#
# The floors the composition test reads move beside it (FLOORS = Path(__file__).with_name("floors.json") stays
# verbatim): tests/reference/floors.json -> tests/models/glm_moe_dsa/floors.json, content unchanged. The engine
# moves definitions, not data files: the file is moved by hand (git mv) before --apply. (Its S3 row in
# move_map.toml keeps the path unchanged; the S3 check verifies only rows that move a file.)

[stage]
name = "S5 D"
kind = "symbols"
base = "bd1681ba"   # the tree this table was written against

# New test modules: the package's docstring style (widened by hand after --apply).
[create]
"tests/models/glm_moe_dsa/test_against_reference.py" = "The unsharded reference model against the production composition (cpu32)."

# The cpu32 cross-validation (its floor-relative criteria, the floors file and its record check)
[moves."tests/reference/test_reference_consistency.py"]
FLOOR_SLACK = "tests/models/glm_moe_dsa/test_against_reference.py"
FRACTION_SLACK = "tests/models/glm_moe_dsa/test_against_reference.py"
FLOORS = "tests/models/glm_moe_dsa/test_against_reference.py"
recorded_floor = "tests/models/glm_moe_dsa/test_against_reference.py"
reports = "tests/models/glm_moe_dsa/test_against_reference.py"
assert_criteria = "tests/models/glm_moe_dsa/test_against_reference.py"
SHORT = "tests/models/glm_moe_dsa/test_against_reference.py"
PROMPT_A = "tests/models/glm_moe_dsa/test_against_reference.py"
test_reference_matches_production_composition = "tests/models/glm_moe_dsa/test_against_reference.py"
test_recorded_floors_are_the_final_oracle_runs = "tests/models/glm_moe_dsa/test_against_reference.py"
