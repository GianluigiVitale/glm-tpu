# S2f step 5: the top-level symbols kept in each production module, and those pruned.
# keep:  reachable in the symbol graph from an entry point (CLI, controller, worker, pack worker)
#        or a surface module (api, ui, envs, config.site, engine.resident_protocol,
#        utils.io_utils, executor.*), executed in the G7 record (class bodies, which run at import,
#        excluded) or in the S0 sys.monitoring coverage, or used by the equivalence harness or a
#        kept test (test oracles included).
# prune: none of these. Generated by the S2f integrator from the pre-prune tree (1101451b), then
#        reviewed by hand against DESIGN 3.3:
#   optimized.errors        research exception classes (HloContractViolationError, Benchmark-,
#                           PartitioningValidationError)
#   optimized.geometry      the pipeline execution-plan types (PlanName, StageAssignment,
#                           _PLAN_GEOMETRIES, ExecutionPlan)
#   optimized.hlo_contract  the lint/policy half (the parser subset stays)
#   optimized.mesh          capacity reports, execution plan, repeated-HLO validation, MLP regexes
#   optimized.reference.*   research variants (stage-local MoE, host-RoPE DSA forms, RMSNorm
#                           schedule/auxiliary variants, the prompt-index repair) and oracles no
#                           kept test uses (reference_moe_from_routes, route_glm_noaux_tc,
#                           materialize_stage_local_prefill_index_wk)
# Reviewed keeps (not dead, kept on purpose): the sampled base methods of
# request_session.Ws32RequestSession and its seeded RequestPolicy/request_uniform (reachable
# through the class the packed session extends; S5 merges the sessions); runtime_checkpoint.
# finalize_ws32_runtime_checkpoint and source_inventory.write_source_inventory (checkpoint tooling
# with kept tests; WU-C's checkpoint commands: S5 WU-C2 writes the inventory with the latter in
# `glm-tpu checkpoint inventory`, and the former stays a library function of the private packing
# driver, with no command, owner decision DN-24(b)); ws32_io.ws32_final_sample_mapped (kept IO test).

