# S4.4 names (DESIGN 10.3 S4; the two blocks S4.2 deferred to S4.4, DN-1): the private helpers that
# other modules import get public names ([renames], applied by `tools/migration/restructure.py --apply
# helper_names.toml` like renames.toml: symbols.py rename step B and the reference pass C/D) and the
# jax.named_scope names lose their research prefixes ([named_scopes], symbols.py step F). `--check
# helper_names.toml` proves every renamed definition AST-equal to its base-commit original with both
# tables applied (imports aside) and every module's scope names equal to its base-commit scope names
# mapped through [named_scopes]. S7 deletes tools/migration/; history keeps it.
#
# Rules (decided under DN-3, owner reviews afterwards; the S4.2 rules applied to the rest):
# * R5: drop the leading underscore of a helper another module imports; a name that is also a common
#   local takes a verb (`_digest` -> `require_digest`, `_nonempty` -> `require_nonempty`,
#   `_nonnegative_int` -> `require_nonnegative_int`), `_plain` -> `plain_path`;
# * named scopes: drop the campaign prefixes greenfield_ and glm_perf_, the topology tag ws32_ (R1),
#   the research tag m64_ (R4) and the implementation adjective pregathered_ (as the kernel name
#   sparse_mla, DN-17); bf16_ stays (as in the S4.2 names dsa_bf16, dense_bf16). A named scope outside
#   a Pallas kernel body never reaches the lowered program (location-free lowering, G14 case iv;
#   G1/G2 byte-identical), and none is inside a kernel body.
# Not renamed: _batched_fleet_all (G9 wire value), _decode_program (the G1 FP8-table capture hook),
# the WU-R admission functions and the classes the work units split (as in renames.toml). Outside the
# 29-row R5 block S4.2 deferred, so still private although other modules import them (FOLLOWUPS 66):
# sharded_state.verify._verify_runtime_value and _verify_runtime_files (writer.py, manifest.py), and
# the names tests and the harness import (verify._read_runtime_metadata, dsa_indexer._NEGATIVE_INFINITY
# and _merge_topk_candidates_scored, norm._accepted_schedule_normalized).

