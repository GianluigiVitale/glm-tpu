# S5 work units (DESIGN 11.3 S5): the renames and reviewed message rewrites of a work unit, applied by
# `tools/migration/restructure.py --apply work_units.toml` (tools/migration/symbols.py: rename step B, the
# reference pass C/D, and step G for [messages]). `--check work_units.toml` proves every renamed definition
# AST-equal to its base-commit original with the renames undone and the messages mapped back (imports aside),
# and every file under [messages] equal to its base-commit text through the same table. A later work unit or
# H-numbered host change that renames or rewrites literals rewrites this table against its own base; each version
# is checked at the commit that applies it (history keeps them: S5 WU-R at f5745edb, S5 H11 at e61145fc). S7
# deletes tools/migration/.
#
# S5 WU-C2 (C = the command line; owner decision DN-24(b), 2026-09-25: the public `checkpoint inventory` and
# `checkpoint verify` commands are added, `finalize` and the packing driver stay private): the two checkpoint
# verification helpers that writer.py and manifest.py import from sharded_state.verify get public names (FOLLOWUPS
# 66; the S4.4 rule R5: a helper another module imports drops its leading underscore). No production message changes;
# no alias stays under the old names. The one [messages] row is the attribute name a test patches on the writer module,
# which imports the helper (the engine follows patch targets only on a module whose definitions the table renames).
# The equivalence harness names neither helper (its G1/G2/G7 driver replaces verify_runtime_checkpoint by a fake, so
# G7 traces neither).

[stage]
name = "S5 WU-C2"
kind = "renames"
base = "66842e0e"   # the tree this table was written against

[renames]
"glm_tpu/model_loader/sharded_state/verify.py:_verify_runtime_value" = "verify_runtime_value"   # the manifest ledger check (writer.py, manifest.py)
"glm_tpu/model_loader/sharded_state/verify.py:_verify_runtime_files" = "verify_runtime_files"   # the file size and hash check (writer.py)

[messages."tests/model_loader/sharded_state/test_format.py"]
"_verify_runtime_value" = "verify_runtime_value"   # the monkeypatch target on the writer module (writer.py imports it)
