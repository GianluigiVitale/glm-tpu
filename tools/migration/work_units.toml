# S5 work units (DESIGN 11.3 S5): the renames and reviewed message rewrites of a work unit, applied by
# `tools/migration/restructure.py --apply work_units.toml` (tools/migration/symbols.py: rename step B, the
# reference pass C/D, and step G for [messages]). `--check work_units.toml` proves every renamed definition
# AST-equal to its base-commit original with the renames undone and the messages mapped back (imports aside),
# and every file under [messages] equal to its base-commit text through the same table twice: by AST (imports
# aside) and by token (every token but the layout ones, so imports and comments included; formatting aside). A
# later work unit or H-numbered host change that renames or rewrites literals rewrites this table against its own
# base; each version is checked at the commit that applies it (history keeps them: S5 WU-R at f5745edb, S5 H11 at
# e61145fc, S5 WU-C2 at fd72f5a3). S7 deletes tools/migration/.
#
# S5 WU-Docs 2/2 (owner decision DN-23(d), 2026-09-25: the unrecorded campaign-labelled error messages are
# reworded): the string constants of raise statements under glm_tpu/ lose the research-era labels WS32, D8,
# challenger and greenfield (WS32 194, D8 6, challenger 3, greenfield 1): 202 raise-statement constants (41 of them
# f-string parts) in 23 files, 197 distinct literals below, plus one unlabelled f-string part that a reworded
# mesh.py message needs. The label and nothing else goes; where it was the sentence's subject, one is named (the
# mesh, the expert-8 x feature-4 mesh, placement, tensor, checkpoint, the target model). Kept: the six messages the
# equivalence records hold (five G4 checkpoint refusals, frozen; one G9 host-mapping refusal, which only an
# H-numbered host change may reword), pinned by tests/test_error_messages.py; the checkpoint-format identifiers that
# carry a label are data, not messages. Every key is, at the base, only the text of raise-statement constants of its
# file. No definition is renamed. The engine's --apply refuses f-string parts, so these rows were applied by a
# reviewed one-off script (each constant rewritten inside its own source span, then ruff format); --check is the
# proof.

[stage]
name = "S5 WU-Docs"
