# S5 work units (DESIGN 11.3 S5): the renames and reviewed message rewrites of a work unit, applied by
# `tools/migration/restructure.py --apply work_units.toml` (tools/migration/symbols.py: rename step B, the
# reference pass C/D, and step G for [messages]). `--check work_units.toml` proves every renamed definition
# AST-equal to its base-commit original with the renames undone and the messages mapped back (imports aside),
# and every file under [messages] equal to its base-commit text through the same table. A later work unit or
# H-numbered host change that renames or rewrites literals rewrites this table against its own base; each version
# is checked at the commit that applies it (history keeps it). S7 deletes tools/migration/.
#
# S5 H11 (the sanctioned host change H11 of DESIGN 6.9, "H11 renames the HLO admission profile string"; owner
# decision DN-21, 2026-09-25: H11 covers only the admission profile string): the HLO admission report's profile
# loses the research label. Every host writes that report to its runtime record (runtime.json,
# programs.<name>.hlo_admission). No definition is renamed; the refusal messages and the report's other keys and
# values are unchanged. The previous version of this table (S5 WU-R, base e04300af: the admission renames and
# refusal wording) is in history at f5745edb; its tools/equivalence/driver.py RECORDED_NAMES rows are permanent.

[stage]
name = "S5 H11"
kind = "renames"
base = "f0e8bc8a"   # the tree this table was written against

[messages."glm_tpu/runner/admission.py"]
"research_ws32_axis_payload_v1" = "ws32_axis_payload_v1"   # runtime.json hlo_admission.profile; G1-/G2-protocol verdicts.hlo.physical_axes_pod_4096_bytes.detail.profile

[messages."tests/runner/test_admission.py"]
"research_ws32_axis_payload_v1" = "ws32_axis_payload_v1"   # the literal pin of the accepted report
