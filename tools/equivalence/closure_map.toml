"glm_tpu.greenfield.kernels.prefill_cache:_require_decode_metadata" = "glm_tpu.greenfield.kernels.stage_local:_require_decode_metadata"
"glm_tpu.runner.compilation_manager:_atomic_json" = "scripts.greenfield.microbench_fp8_matmul:_atomic_json"
"glm_tpu.runner.compilation_manager:_compiled_memory" = "scripts.greenfield.microbench_fp8_matmul:_compiled_memory"
"glm_tpu.runner.compilation_manager:_memory_stats" = "scripts.greenfield.microbench_fp8_matmul:_memory_stats"

