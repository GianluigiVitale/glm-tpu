# Reviewed rename table for G6 (import closures) and G7 (executed functions); see closure_map.py.
# Keys are current names, values the names recorded in tests/golden/data. Every entry is added in
# the commit that moves or renames the code and is reviewed there; the entries are removed again
# after `python -m tools.equivalence record --gates G6,G7 --rename-only --reason <stage|H#>`.

[modules]
# "glm_tpu.runner.compilation_manager" = "scripts.greenfield.ws32_compile_originals"
# "glm_tpu.engine." = "glm_tpu.optimized."            (package prefix: both sides end in ".")
# S2a: the worker's helpers moved out of the research modules (each new module maps to the module
# its main helper came from; the other moved functions are listed under [functions]).
"glm_tpu.distributed.parallel_state" = "scripts.greenfield.run_short_decoder_ws32"
"glm_tpu.runner.compilation_manager" = "scripts.greenfield.ws32_compile_originals"
"glm_tpu.runner.kv_cache_manager" = "scripts.greenfield.ws32_native_benchmark_programs"

[functions]
