[build-system]
requires = ["setuptools==78.1.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "glm-tpu"
version = "0.1.0a1"
description = "Native-JAX GLM TPU engine and validation components (private release candidate)"
readme = "README.md"
license-files = ["THIRD_PARTY_NOTICES.md", "licenses/*.txt", "glm_tpu/models/glm_moe_dsa/hf_config/LICENSE"]
requires-python = ">=3.12,<3.13"
classifiers = [
  "Private :: Do Not Upload",
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.12",
  "Operating System :: POSIX :: Linux",
]
dependencies = [
  "jax==0.10.1",
  "jaxlib==0.10.1",
  "numpy==2.3.5",
  "ml-dtypes==0.5.4",
]

[project.optional-dependencies]
runtime = [
  "torch==2.10.0",
  "safetensors==0.7.0",
  "transformers==5.12.0",
  "tokenizers==0.22.2",
  "huggingface-hub==1.17.0",
  "google-cloud-storage==3.10.1",
  "google-crc32c==1.8.0",
  "protobuf==6.33.6",
  "grpcio==1.80.0",
  "requests==2.34.2",
]
tpu = ["libtpu==0.0.41"]
benchmark = ["pyarrow==24.0.0", "python-dotenv==1.2.2"]
dev = ["pytest==9.0.3"]

[project.scripts]
glm-tpu = "glm_tpu.entrypoints.cli.main:main"

[tool.setuptools.packages.find]
include = ["glm_tpu", "glm_tpu.*"]
namespaces = false

[tool.setuptools.package-data]
glm_tpu = ["environment.json", "models/glm_moe_dsa/hf_config/*", "entrypoints/ui/static/*"]

# CPU PyTorch is used only for checkpoint tensor reading. Do not resolve CUDA
# wheels or let the PyTorch index shadow unrelated PyPI package versions.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

# Lint and format with ruff 0.16.8, a developer tool outside the runtime environments
# (CONTRIBUTING.md). Rules: pycodestyle (E, W), Pyflakes (F), bugbear (B), pyupgrade (UP),
# simplify (SIM), comprehensions (C4) and ruff's own (RUF); lines up to 120 characters.
[tool.ruff]
required-version = "==0.16.8"
line-length = 120
target-version = "py312"
# Apply the excludes below also to paths named on the command line (an editor, a hook).
force-exclude = true

# The remote helpers run under the hosts' system python3 (3.10; glm_tpu/executor/remote/__init__.py).
[tool.ruff.per-file-target-version]
"glm_tpu/executor/remote/*.py" = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "C4", "RUF"]
# dict(key=value) is this code base's spelling of a record, and `a + [b]` its spelling of a
# concatenation (RUF005's fix is unsafe: unpacking changes the result type of non-list operands).
ignore = ["C408", "RUF005"]

[tool.ruff.lint.per-file-ignores]
# A helper refuses an older interpreter at run time: its version check is not dead code. The helper
# texts are sent to the hosts byte for byte (G9 records their SHA-256), so their %-formatting stays.
"glm_tpu/executor/remote/*.py" = ["UP031", "UP036"]
# The worker's phase closures and token callbacks run within the loop iteration that defines them.
"glm_tpu/worker/tpu_worker.py" = ["B023"]
# The S2f provenance test (tests/test_production_helper_homes.py) compares these files' moved
# definitions by AST with their originals; their findings stay until S7 retires that test.
"glm_tpu/config/model.py" = ["UP037"]
"glm_tpu/distributed/topology.py" = ["UP037"]
"glm_tpu/model_loader/placement.py" = ["SIM102"]
"glm_tpu/model_loader/sharded_state/loader.py" = ["F841"]
"glm_tpu/model_loader/sharded_state/writer.py" = ["C413", "C420"]
"glm_tpu/model_loader/source_inventory.py" = ["C420", "UP037"]

[tool.ruff.lint.flake8-bugbear]
# Frozen dataclasses used as argument defaults (numerical contracts, kernel configurations): each is
# @dataclass(frozen=True, slots=True), so a shared default instance is safe.
extend-immutable-calls = [
  "glm_tpu.kernels.fp8_grouped_matmul.kernel.RoutedProjectionConfig",
  "glm_tpu.kernels.sparse_mla.kernel.SparseMlaConfig",
  "glm_tpu.layers.contracts.DsaNumericalContract",
  "glm_tpu.layers.contracts.GlmMoeNumericalContract",
  "glm_tpu.layers.contracts.MlaNumericalContract",
  "glm_tpu.layers.contracts.StageLocalKvLayout",
]

[tool.ruff.format]
# The remote helper files are sent to the hosts byte for byte and the equivalence harness records
# their SHA-256 (G9): reformatting them changes what the hosts receive, a host change of its own.
exclude = ["glm_tpu/executor/remote/*.py"]
# LF is pinned (ruff's default is "auto"); the other four settings are the defaults, written out.
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = false
